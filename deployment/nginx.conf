# Private BS Ads Nginx only. The shared host Caddy configuration is unchanged.
server {
    listen 8080;
    server_name sharkads.brandshark.in;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    set_real_ip_from 172.23.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    client_max_body_size 64m;
    location ~ ^/(api|sanctum)(/|$)|^/up$|^/shopify/app/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
        fastcgi_read_timeout 180s;
    }
    location /shopify/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /shopify/ { return 404; }
    location /storage/ { alias /var/www/storage/app/public/; add_header X-Content-Type-Options nosniff always; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
